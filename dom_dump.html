:root {
  /* Clean Light Mode Commercial Supermarket POS Theme (Default) */
  --bg-primary: #f1f5f9;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f8fafc;
  --bg-glass: #ffffff;
  --bg-glass-card: #ffffff;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  
  --accent-primary: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-cyan: #0284c7;
  --accent-success: #16a34a;
  --accent-danger: #dc2626;
  --accent-warning: #d97706;
  
  --accent-gradient: #2563eb;
  --accent-cyan-gradient: #0284c7;
  --accent-success-gradient: #16a34a;
  --accent-danger-gradient: #dc2626;
  --accent-warning-gradient: #d97706;
  
  --border-color: #cbd5e1;
  --border-light: #e2e8f0;
  --border-glow: #2563eb;
  --border-cyan-glow: #0284c7;
  
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.1);
  --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.15);
  --shadow-glass: 0 2px 10px rgba(15, 23, 42, 0.05);
  
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 10px;
  
  --font-sans: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
}

/* Optional Dark Theme Class */

body.dark-theme {
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-tertiary: #334155;
  --bg-glass: #1e293b;
  --bg-glass-card: #1e293b;
  
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  
  --border-color: #334155;
  --border-light: #475569;
  --border-glow: #3b82f6;
  
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.6);
  --shadow-glass: 0 4px 20px rgba(0, 0, 0, 0.4);
}

/* Global Reset & Base */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition-normal), color var(--transition-normal);
  overflow: hidden;
  user-select: none;
}

h1, h2, h3, h4, h5, h6 {
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

p {
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Commercial POS Panels & Cards */

.glass-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
  border-radius: var(--radius-md);
}

.glass-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-fast) ease;
}

.glass-card:hover {
  border-color: var(--border-glow);
  box-shadow: var(--shadow-md);
}

/* Commercial POS Buttons */

.btn {
  padding: 0.55rem 1.1rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition-fast) ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  font-size: 0.88rem;
  outline: none;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: #2563eb;
  color: #ffffff;
}

.btn-primary:hover {
  background: #1d4ed8;
}

.btn-cyan {
  background: #2563eb;
  color: #ffffff;
}

.btn-cyan:hover {
  background: #1d4ed8;
}

.btn-success {
  background: #16a34a;
  color: #ffffff;
  font-weight: 700;
}

.btn-success:hover {
  background: #15803d;
}

.btn-warning {
  background: #d97706;
  color: #ffffff;
  font-weight: 600;
}

.btn-warning:hover {
  background: #b45309;
}

.btn-danger {
  background: #dc2626;
  color: #ffffff;
}

.btn-danger:hover {
  background: #b91c1c;
}

.btn-secondary {
  background: #ffffff;
  color: #334155;
  border: 1px solid #cbd5e1;
}

.btn-secondary:hover {
  background: #f1f5f9;
  color: #0f172a;
  border-color: #94a3b8;
}

/* Keyboard Shortcut Hotkey Badges */

.hotkey-badge {
  display: inline-block;
  padding: 0.15rem 0.45rem;
  background: rgba(99, 102, 241, 0.25);
  border: 1px solid var(--border-glow);
  color: #a5b4fc;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: var(--radius-sm);
  margin-left: 0.35rem;
}

/* Form & Input Controls */

input[type="text"], input[type="number"], input[type="password"], input[type="tel"], input[type="email"], select, textarea {
  width: 100%;
  padding: 0.7rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  outline: none;
  transition: all var(--transition-fast);
}

input:focus, select:focus, textarea:focus {
  border-color: var(--accent-cyan);
  box-shadow: var(--shadow-cyan-neon);
}

/* Monochrome Monospace Numbers for POS Prices */

.price-mono {
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: -0.03em;
}

/* Animations */

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
  50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }
}

.animate-fade-in {
  animation: fadeIn var(--transition-normal) forwards;
}

.pulse-neon {
  animation: pulseGlow 2s infinite ease-in-out;
}

/* Scrollbars */

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent-primary);
}

/* Responsive Table */

.table-responsive {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-glass);
}

.premium-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.premium-table th, .premium-table td {
  padding: 0.9rem 1.1rem;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-primary);
}

.premium-table th {
  background-color: var(--bg-tertiary);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 0.78rem;
  letter-spacing: 0.8px;
  color: var(--text-secondary);
}

.premium-table tbody tr {
  transition: background-color var(--transition-fast) ease;
}

.premium-table tbody tr:hover {
  background-color: rgba(99, 102, 241, 0.06);
}
